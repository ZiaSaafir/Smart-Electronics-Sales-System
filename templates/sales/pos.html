{% extends 'base.html' %}

{% block content %}

<div class="row">
    <!-- Left Column - Products -->
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 pt-3">
                <h5 class="mb-0">
                    <i class="fas fa-search text-primary me-2"></i>Find Products
                </h5>
            </div>
            <div class="card-body">
                <!-- Search Box -->
                <div class="input-group mb-3">
                    <span class="input-group-text bg-white">
                        <i class="fas fa-barcode text-muted"></i>
                    </span>
                    <input type="text" id="productSearch" 
                           placeholder="Search by name, SKU, or scan barcode..." 
                           class="form-control form-control-lg"
                           autofocus>
                    <button class="btn btn-outline-secondary" onclick="clearSearch()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <!-- Category Filters - Scrollable Compact Design -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <small class="text-muted">Filter by Category:</small>
                        <div>
                            <select id="sortBy" class="form-select form-select-sm" style="width: auto; display: inline-block;" onchange="performSearch()">
                                <option value="name_asc">Sort: Name A-Z</option>
                                <option value="name_desc">Sort: Name Z-A</option>
                                <option value="price_asc">Sort: Price (Low to High)</option>
                                <option value="price_desc">Sort: Price (High to Low)</option>
                                <option value="stock_asc">Sort: Stock (Low to High)</option>
                                <option value="stock_desc">Sort: Stock (High to Low)</option>
                            </select>
                        </div>
                    </div>
                    <div class="category-wrapper" style="max-height: 80px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 8px; padding: 8px;">
                        <div class="d-flex flex-wrap gap-2" id="categoryFilters">
                            <button class="btn btn-sm btn-primary" onclick="filterByCategory('all')">
                                All Products
                            </button>
                            {% for category in categories %}
                            <button class="btn btn-sm btn-outline-secondary" 
                                    onclick="filterByCategory('{{ category.name|lower }}')">
                                {{ category.name }}
                            </button>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                
                <!-- View Toggle & Results Count -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div id="resultsCount" class="text-muted small"></div>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="toggleView('list')" id="viewListBtn">
                            <i class="fas fa-list"></i> List
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="toggleView('grid')" id="viewGridBtn">
                            <i class="fas fa-th"></i> Grid
                        </button>
                    </div>
                </div>
                
                <!-- Search Results -->
                <div id="searchResults" style="max-height: 500px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>
    
    <!-- Right Column - Cart (Same as before) -->
    <div class="col-lg-5">
        <!-- Customer Card -->
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-white border-0 pt-3">
                <h5 class="mb-0">
                    <i class="fas fa-user text-success me-2"></i>Customer Details
                </h5>
            </div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-12">
                        <input type="text" id="customerName" class="form-control" placeholder="Customer Name (Optional)">
                    </div>
                    <div class="col-7">
                        <input type="text" id="customerPhone" class="form-control" placeholder="Phone Number">
                    </div>
                    <div class="col-5">
                        <select id="paymentMethod" class="form-select">
                            <option value="cash">Cash</option>
                            <option value="easypaisa">EasyPaisa</option>
                            <option value="card">Card</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Cart Card -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-0 pt-3">
                <h5 class="mb-0">
                    <i class="fas fa-shopping-cart text-primary me-2"></i>
                    Current Order
                    <span class="badge bg-primary float-end" id="cartCount">0</span>
                </h5>
            </div>
            <div class="card-body p-0">
                <div style="max-height: 400px; overflow-y: auto;">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Item</th>
                                <th width="80">Qty</th>
                                <th width="80">Price</th>
                                <th width="80">Total</th>
                                <th width="40"></th>
                            </tr>
                        </thead>
                        <tbody id="cartBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="fas fa-box-open fa-2x d-block mb-2"></i>
                                    Cart is empty
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-0 pb-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <strong>Grand Total:</strong>
                    <h4 class="text-success mb-0">Rs <span id="grandTotal">0.00</span></h4>
                </div>
                <div class="d-grid gap-2">
                    <button id="checkoutBtn" class="btn btn-success btn-lg" onclick="checkoutSale()">
                        Complete Sale (F5)
                    </button>
                    <button class="btn btn-outline-secondary" onclick="clearCart()">
                        Clear Cart (Ctrl+C)
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Hidden Select for F2 -->
<select id="productSelect" class="d-none">
    {% for product in products %}
    <option value="{{ product.id }}" 
            data-name="{{ product.name }}"
            data-price="{{ product.selling_price }}"
            data-stock="{{ product.stock_quantity }}"
            data-category="{{ product.category.name|lower }}">
        {{ product.name }}
    </option>
    {% endfor %}
</select>

<script>
// ============================================
// DATA
// ============================================
let cart = [];
let currentCategory = 'all';
let currentView = 'list'; // list or grid
let currentSort = 'name_asc';

let allProducts = [
    {% for product in products %}
    {
        id: "{{ product.id }}",
        name: "{{ product.name|escapejs }}",
        price: {{ product.selling_price }},
        category: "{{ product.category.name|lower|default:'other' }}",
        stock: {{ product.stock_quantity }}
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
];

// ============================================
// SORT FUNCTION
// ============================================
function sortProducts(products) {
    let sortValue = document.getElementById('sortBy').value;
    currentSort = sortValue;
    
    let sorted = [...products];
    
    switch(sortValue) {
        case 'name_asc':
            sorted.sort((a, b) => a.name.localeCompare(b.name));
            break;
        case 'name_desc':
            sorted.sort((a, b) => b.name.localeCompare(a.name));
            break;
        case 'price_asc':
            sorted.sort((a, b) => a.price - b.price);
            break;
        case 'price_desc':
            sorted.sort((a, b) => b.price - a.price);
            break;
        case 'stock_asc':
            sorted.sort((a, b) => a.stock - b.stock);
            break;
        case 'stock_desc':
            sorted.sort((a, b) => b.stock - a.stock);
            break;
        default:
            sorted.sort((a, b) => a.name.localeCompare(b.name));
    }
    return sorted;
}

// ============================================
// VIEW TOGGLE
// ============================================
function toggleView(view) {
    currentView = view;
    let listBtn = document.getElementById('viewListBtn');
    let gridBtn = document.getElementById('viewGridBtn');
    
    if (view === 'list') {
        listBtn.classList.add('btn-primary');
        listBtn.classList.remove('btn-outline-secondary');
        gridBtn.classList.add('btn-outline-secondary');
        gridBtn.classList.remove('btn-primary');
    } else {
        gridBtn.classList.add('btn-primary');
        gridBtn.classList.remove('btn-outline-secondary');
        listBtn.classList.add('btn-outline-secondary');
        listBtn.classList.remove('btn-primary');
    }
    performSearch();
}

// ============================================
// FILTER FUNCTIONS
// ============================================
function filterByCategory(category) {
    currentCategory = category;
    
    // Update button styles
    let btns = document.querySelectorAll('#categoryFilters button');
    btns.forEach(btn => {
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-outline-secondary');
    });
    event.target.classList.remove('btn-outline-secondary');
    event.target.classList.add('btn-primary');
    
    performSearch();
}

function performSearch() {
    let searchText = document.getElementById("productSearch").value.toLowerCase().trim();
    
    let filtered = allProducts.filter(product => {
        if (currentCategory !== 'all' && product.category !== currentCategory) {
            return false;
        }
        if (searchText && !product.name.toLowerCase().includes(searchText)) {
            return false;
        }
        return true;
    });
    
    // Apply sorting
    filtered = sortProducts(filtered);
    
    displayResults(filtered);
}

function displayResults(products) {
    let resultsDiv = document.getElementById("searchResults");
    let resultsCount = document.getElementById("resultsCount");
    
    resultsCount.innerHTML = `Found ${products.length} products`;
    
    if (products.length === 0) {
        resultsDiv.innerHTML = '<div class="alert alert-info text-center">No products found</div>';
        return;
    }
    
    if (currentView === 'list') {
        // List View
        let html = '<div class="list-group">';
        products.forEach(product => {
            let stockBadge = '';
            let disabledClass = '';
            let disabledAttr = '';
            
            if (product.stock <= 0) {
                stockBadge = '<span class="badge bg-danger ms-2">Out of Stock</span>';
                disabledClass = 'opacity-50';
                disabledAttr = 'disabled';
            } else if (product.stock <= 5) {
                stockBadge = `<span class="badge bg-warning ms-2">Low Stock (${product.stock})</span>`;
            }
            
            html += `
                <button type="button" 
                        class="list-group-item list-group-item-action ${disabledClass}"
                        onclick="addToCart('${product.id}', '${product.name.replace(/'/g, "\\'")}', ${product.price}, ${product.stock})"
                        ${disabledAttr}>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${product.name}</strong>${stockBadge}<br>
                            <small class="text-muted">Price: Rs ${product.price} | Stock: ${product.stock}</small>
                        </div>
                        <span class="badge bg-primary rounded-pill">Add</span>
                    </div>
                </button>
            `;
        });
        html += '</div>';
        resultsDiv.innerHTML = html;
    } else {
        // Grid View
        let html = '<div class="row g-2">';
        products.forEach(product => {
            let stockBadge = '';
            let disabledClass = '';
            let disabledAttr = '';
            
            if (product.stock <= 0) {
                stockBadge = '<span class="badge bg-danger">Out</span>';
                disabledClass = 'opacity-50';
                disabledAttr = 'disabled';
            } else if (product.stock <= 5) {
                stockBadge = `<span class="badge bg-warning">Low</span>`;
            }
            
            html += `
                <div class="col-6 col-md-4">
                    <button type="button" 
                            class="btn btn-outline-primary w-100 text-start p-2 ${disabledClass}"
                            style="border-radius: 8px;"
                            onclick="addToCart('${product.id}', '${product.name.replace(/'/g, "\\'")}', ${product.price}, ${product.stock})"
                            ${disabledAttr}>
                        <div class="small fw-bold">${product.name.substring(0, 20)}</div>
                        <div class="small text-primary">Rs ${product.price}</div>
                        <div class="small text-muted">Stock: ${product.stock} ${stockBadge}</div>
                    </button>
                </div>
            `;
        });
        html += '</div>';
        resultsDiv.innerHTML = html;
    }
}

// ============================================
// SEARCH EVENT
// ============================================
let searchTimeout;
document.getElementById("productSearch").addEventListener("input", function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => performSearch(), 300);
});

function clearSearch() {
    document.getElementById("productSearch").value = "";
    performSearch();
    document.getElementById("productSearch").focus();
}

// ============================================
// ADD TO CART (WITH STOCK VALIDATION)
// ============================================
function addToCart(id, name, price, stock) {
    if (stock <= 0) {
        alert("Out of Stock! This product is not available.");
        return;
    }
    
    if (stock < 5) {
        let confirmAdd = confirm(`Low Stock Alert! Only ${stock} items left. Add anyway?`);
        if (!confirmAdd) {
            return;
        }
    }
    
    let existing = cart.find(item => item.id == id);
    if (existing) {
        if (existing.qty + 1 > stock) {
            alert(`Cannot add more! Only ${stock} items available.`);
            return;
        }
        existing.qty += 1;
    } else {
        cart.push({
            id: id,
            name: name,
            price: price,
            qty: 1,
            maxStock: stock
        });
    }
    renderCart();
    
    document.getElementById("productSearch").value = "";
    performSearch();
    document.getElementById("productSearch").focus();
}

function renderCart() {
    let body = document.getElementById("cartBody");
    let grandTotal = 0;
    let itemCount = 0;
    
    if (cart.length === 0) {
        body.innerHTML = `<td><td colspan="5" class="text-center text-muted py-5">
            <i class="fas fa-box-open fa-2x d-block mb-2"></i>Cart is empty
        \n</td></tr>`;
        document.getElementById("grandTotal").innerText = "0.00";
        document.getElementById("cartCount").innerText = "0";
        return;
    }
    
    body.innerHTML = "";
    cart.forEach((item, index) => {
        let total = item.price * item.qty;
        grandTotal += total;
        itemCount += item.qty;
        
        body.innerHTML += `
        <tr>
            <td><small>${item.name.length > 25 ? item.name.substring(0,22)+'...' : item.name}</small></td>
            <td>
                <div class="input-group input-group-sm">
                    <button class="btn btn-outline-secondary" onclick="updateQty(${index}, ${item.qty - 1})">-</button>
                    <span class="px-2 py-1">${item.qty}</span>
                    <button class="btn btn-outline-secondary" onclick="updateQty(${index}, ${item.qty + 1})">+</button>
                </div>
            </div>
            <td><small>${item.price}</small></td>
            <td><small>${total.toFixed(2)}</small></td>
            <td><button class="btn btn-sm btn-danger" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button></td>
        </tr>`;
    });
    
    document.getElementById("grandTotal").innerText = grandTotal.toFixed(2);
    document.getElementById("cartCount").innerText = itemCount;
}

function updateQty(index, newQty) {
    if (newQty < 1) newQty = 1;
    
    let item = cart[index];
    let product = allProducts.find(p => p.id == item.id);
    if (product && newQty > product.stock) {
        alert(`Only ${product.stock} items available in stock.`);
        return;
    }
    
    cart[index].qty = newQty;
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

function clearCart() {
    if (cart.length > 0 && confirm("Clear entire cart?")) {
        cart = [];
        renderCart();
    }
}

// ============================================
// CHECKOUT
// ============================================
function checkoutSale() {
    if (cart.length === 0) {
        alert("Cart is empty");
        return;
    }
    
    for (let item of cart) {
        let product = allProducts.find(p => p.id == item.id);
        if (!product) {
            alert(`Product ${item.name} not found`);
            return;
        }
        if (item.qty > product.stock) {
            alert(`Not enough stock for ${item.name}. Available: ${product.stock}`);
            return;
        }
    }
    
    let btn = document.getElementById("checkoutBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Processing...';
    
    fetch("/pos/checkout/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({
            cart: cart,
            customer_name: document.getElementById("customerName").value,
            customer_phone: document.getElementById("customerPhone").value,
            payment_method: document.getElementById("paymentMethod").value
        })
    })
    .then(response => response.json())
    .then(data => {
        window.location.href = "/pos/invoice/" + data.sale_id + "/";
    })
    .catch(error => {
        alert("Checkout failed: " + error.message);
        btn.disabled = false;
        btn.innerHTML = 'Complete Sale (F5)';
    });
}

// ============================================
// KEYBOARD SHORTCUTS
// ============================================
document.addEventListener('keydown', function(event) {
    if (event.key === 'F2') {
        event.preventDefault();
        let select = document.getElementById("productSelect");
        let option = select.options[select.selectedIndex];
        addToCart(option.value, option.dataset.name, parseFloat(option.dataset.price), parseInt(option.dataset.stock || 0));
    }
    if (event.key === 'F5') {
        event.preventDefault();
        checkoutSale();
    }
    if (event.key === 'F3') {
        event.preventDefault();
        document.getElementById("productSearch").focus();
    }
    if (event.ctrlKey && event.key === 'c') {
        event.preventDefault();
        clearCart();
    }
});

function getCookie(name) {
    let value = null;
    if (document.cookie) {
        document.cookie.split(';').forEach(cookie => {
            let c = cookie.trim();
            if (c.startsWith(name + '=')) {
                value = decodeURIComponent(c.substring(name.length + 1));
            }
        });
    }
    return value;
}

// Initialize
performSearch();
document.getElementById("productSearch").focus();
</script>

{% endblock %}
